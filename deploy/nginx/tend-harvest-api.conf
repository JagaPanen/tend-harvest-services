# Install on the VPS:
#   sudo cp tend-harvest-api.conf /etc/nginx/sites-available/tend-harvest-api
#   sudo ln -sf /etc/nginx/sites-available/tend-harvest-api /etc/nginx/sites-enabled/tend-harvest-api
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certbot (DNS for jagapanen.avsatya.dev must already point at this VPS):
#   sudo certbot --nginx -d jagapanen.avsatya.dev
# Certbot writes the 443 server block and the HTTP redirect. Confirm with:
#   sudo nginx -t && sudo systemctl reload nginx

# Upstream configuration for load balancing
upstream tend_harvest_api {
    least_conn;  # Use least connections algorithm
    server localhost:8009 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Rate limiting zones
# Named separately from image-services-v2 so both site files can load together.
limit_req_zone $binary_remote_addr zone=harvest_api_limit:10m rate=100r/s;

# Echo the request origin only when it is one of these sites.
# An empty value omits Access-Control-Allow-Origin, which the browser reports as a CORS block.
map $http_origin $harvest_cors_origin {
    default "";
    "~*^https?://([\w-]+\.)*avsatya\.dev(?::\d+)?$" $http_origin;
    "~*^https://[\w-]+(\.[\w-]+)*\.vercel\.app(?::\d+)?$" $http_origin;
    "~*^https?://localhost(:\d+)?$"                 $http_origin;
    "~*^https?://127\.0\.0\.1(:\d+)?$"              $http_origin;
}

server {
    listen 80;
    server_name jagapanen.avsatya.dev;

    # Define the MIME types that Nginx will handle
    include mime.types;
    default_type application/octet-stream;

    # Set the server timezone
    fastcgi_param TZ "Asia/Jakarta";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Configure request buffering to improve performance
    client_body_buffer_size 256k;
    client_header_buffer_size 2k;
    client_max_body_size 32m;
    large_client_header_buffers 4 8k;

    # Proxy settings optimized services
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 300s;  # Optimization runs can take longer than a normal request
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;

    # Enable Gzip compression for various file types
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Timeout settings optimized services
    send_timeout 120s;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Logging with rotation
    access_log /var/log/nginx/jagapanen.access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/jagapanen.error.log warn;

    # Cache settings for results
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
    proxy_cache_valid 200 60m;
    proxy_cache_valid 404 1m;

    # Health check endpoint (no rate limiting)
    location /health {
        proxy_pass http://tend_harvest_api;
        proxy_buffering off;
        access_log off;
    }

    # API endpoints with standard rate limiting
    location /api/ {
        limit_req zone=harvest_api_limit burst=20 nodelay;

        # Preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin;
            add_header Access-Control-Allow-Credentials true;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }

        # Strip upstream CORS to prevent duplicates
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;

        # Add a single, valid set of CORS headers on all responses
        add_header Access-Control-Allow-Origin $harvest_cors_origin always;
        add_header Vary Origin always;
        add_header Access-Control-Allow-Credentials true always;

        proxy_pass http://tend_harvest_api;
        proxy_buffering off;
    }

    # Docs, OpenAPI, and every other route
    location / {

        # Preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin;
            add_header Access-Control-Allow-Credentials true;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }

        # Strip upstream CORS to prevent duplicates
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;

        # Add a single, valid set of CORS headers on all responses
        add_header Access-Control-Allow-Origin $harvest_cors_origin always;
        add_header Vary Origin always;
        add_header Access-Control-Allow-Credentials true always;

        proxy_pass http://tend_harvest_api;
        proxy_buffering off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Status page for monitoring
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}
