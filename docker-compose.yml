# Local verify stack for JagaPanen V2 P0 (API + Postgres).
# Secrets and credentials come from .env (see .env.example) — never hardcode them here.
# Usage (from this directory):
#   cp .env.example .env   # then set POSTGRES_* / JWT_SECRET / DATABASE_*
#   docker compose up --build -d
#   curl http://localhost:${API_PORT:-8009}/health

services:
  postgres:
    image: postgres:16-alpine
    container_name: jagapanen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - jagapanen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jagapanen-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override host-oriented DATABASE_* from .env for the compose network.
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "${API_PORT:-8009}:${API_PORT:-8009}"

volumes:
  jagapanen_pgdata:
